<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fennel's Leap</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1b2a3a; overflow: hidden; }
    /* Whole-pixel art: the kit renders at the device size with a whole
       scale; if the browser ever scales the canvas, keep the pixels square. */
    #evani-canvas { display: block; width: 100vw; height: 100vh; touch-action: none;
                    image-rendering: pixelated; image-rendering: crisp-edges; }
    #ui { position: fixed; inset: 0; z-index: 900; pointer-events: none; color: #fff8e0;
          font: 700 16px/1.3 "Lucida Console", "Courier New", ui-monospace, monospace;
          --ink: #1a1424; --leaf: #6cc04a; --sun: #ffd84a; --berry: #e2506a; --sky: #8fd3ff; }
    #ui .ink { text-shadow: 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 3px 0 var(--ink), 0 -3px 0 var(--ink), 3px 3px 0 var(--ink); }
    .screen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center;
              justify-content: center; gap: 14px; pointer-events: auto; text-align: center; padding: 12px; box-sizing: border-box; }
    .screen.on { display: flex; }
    .dim { background: rgba(26, 20, 36, 0.6); }
    h1 { margin: 0; font-size: clamp(36px, 8vw, 88px); letter-spacing: 3px; color: var(--sun); }
    h2 { margin: 0; font-size: clamp(30px, 6vw, 64px); color: var(--sun); }
    .sub { margin: 0; font-size: clamp(15px, 2.4vw, 20px); }
    .menu { display: flex; flex-direction: column; gap: 10px; min-width: 240px; }
    button { font: inherit; font-size: 20px; padding: 10px 22px; border-radius: 0; cursor: pointer;
             border: 4px solid var(--ink); background: var(--leaf); color: var(--ink); box-shadow: 4px 4px 0 var(--ink); }
    button:hover, button:focus-visible { background: var(--sun); outline: none; }
    button:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
    button.alt { background: var(--sky); }
    .keys { font-size: 13px; background: rgba(26, 20, 36, 0.75); padding: 8px 12px; margin: 0; max-width: 640px; }
    .panel { background: rgba(26, 20, 36, 0.92); border: 4px solid var(--ink); box-shadow: 4px 4px 0 #000; padding: 16px 22px;
             max-height: 82vh; overflow: auto; text-align: left; min-width: 300px; max-width: 92vw; box-sizing: border-box; }
    .panel h3 { margin: 12px 0 6px; color: var(--sun); font-size: 17px; }
    .panel label { display: flex; gap: 8px; align-items: center; margin: 4px 0; font-size: 15px; }
    .panel select, .panel input[type=range] { font: inherit; font-size: 15px; }
    .binds { border-collapse: collapse; font-size: 15px; }
    .binds td { padding: 3px 8px; }
    .binds button { font-size: 14px; padding: 3px 10px; box-shadow: 3px 3px 0 var(--ink); min-width: 120px; }
    .note { font-size: 13px; opacity: 0.85; margin: 6px 0 0; }
    #res-table { border-collapse: collapse; font-size: 18px; background: rgba(26, 20, 36, 0.8); border: 4px solid var(--ink); }
    #res-table td { padding: 4px 16px; text-align: left; white-space: nowrap; }
    #res-table td + td { text-align: right; color: var(--sun); }
    #res-table tr:last-child td { border-top: 3px solid var(--sun); font-size: 22px; }
  </style>
  <!-- Trunk builds the evani-2d-platformer binary; wasm-opt -Oz runs in release.
       The --enable flags match the wasm features rustc turns on by default
       for wasm32-unknown-unknown; without them Trunk's wasm-opt rejects the module. -->
  <link data-trunk rel="rust" data-bin="evani-2d-platformer" data-wasm-opt="z"
        data-wasm-opt-params="--enable-bulk-memory --enable-bulk-memory-opt --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue --low-memory-unused"
        data-type="main">
</head>
<body>
  <canvas id="evani-canvas"></canvas>
  <!-- The game's light DOM menus. The kit draws the in-play HUD; the wasm
       fills the settings and results and shows one screen at a time;
       buttons say what they do in data-cmd. -->
  <div id="ui">
    <div id="title" class="screen">
      <h1 class="ink">Fennel's Leap</h1>
      <p class="sub ink">Bramble Hills &middot; reach the castle gate</p>
      <div class="menu">
        <button data-cmd="play">Play</button>
        <button data-cmd="settings" class="alt">Settings</button>
      </div>
      <p class="keys">A D or arrows to walk, hold Shift to run, Space to jump (hold for higher).<br>
        Stomp beetles, grab coins, touch flags to save your place. S + Space drops through planks. Esc pauses.</p>
    </div>
    <div id="pause" class="screen dim">
      <h2 class="ink">Paused</h2>
      <div class="menu">
        <button data-cmd="resume">Resume</button>
        <button data-cmd="restart">Restart level</button>
        <button data-cmd="settings" class="alt">Settings</button>
        <button data-cmd="title" class="alt">Quit to title</button>
      </div>
    </div>
    <div id="results" class="screen dim">
      <h2 id="res-head" class="ink"></h2>
      <p id="res-sub" class="sub ink"></p>
      <table id="res-table"></table>
      <div class="menu">
        <button data-cmd="restart">Play again</button>
        <button data-cmd="title" class="alt">Title screen</button>
      </div>
    </div>
    <div id="settings" class="screen dim">
      <div class="panel" id="settings-body"></div>
      <button data-cmd="close-settings">Back</button>
    </div>
  </div>
</body>
</html>
