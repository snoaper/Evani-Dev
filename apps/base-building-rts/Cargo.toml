[package]
name = "evani-base-building-rts"
description = "Evani.Dev Cinder Ridge: the base-building-rts kit in the stylizedpbr look, one player against a rival AI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish.workspace = true

# Module switches. `cargo xtask build base-building-rts` reads evani.toml and turns it
# into exactly these features (with --no-default-features), so a module the
# game doesn't list is an absent optional dependency: zero bytes.
# `default` mirrors evani.toml so a plain `trunk serve` matches it.
[features]
default = ["shadows", "physics-simple", "live"]
fx = ["dep:evani-fx"]
bloom = ["fx", "evani-fx/bloom"]
vignette = ["fx", "evani-fx/vignette"]
shadows = ["fx", "evani-fx/shadows"]
physics-simple = ["dep:evani-physics", "evani-physics/simple"]
physics-rigid = ["dep:evani-physics", "evani-physics/rigid"]
net = ["dep:evani-net"]
xr = ["dep:evani-xr"]
# Stage 3 modules (evani.toml `models`, `anim`, `ui`). `models` pulls in the
# model reader (evani-gltf) and the model pipeline (evani-render/models); `anim` adds
# the animation runtime (evani-anim), `ui` the box layout (evani-ui).
models = ["dep:evani-gltf", "evani-core/texture-budget", "evani-render/models"]
anim = ["models", "dep:evani-anim"]
# `ui` turns on sharp MSDF text in the canvas (`[ui] fonts` in evani.toml);
# the box layout crate (evani-ui, S3-13b) comes with it.
ui = ["evani-render/msdf", "dep:evani-ui"]
live = ["dep:evani-live", "evani-render/hooks", "evani-render/capture"]

[dependencies]
evani-core = { workspace = true, features = ["touch"] }
evani-render.workspace = true
evani-kit-base-building-rts.workspace = true
evani-look-stylizedpbr.workspace = true
evani-fx = { workspace = true, optional = true }
evani-physics = { workspace = true, optional = true }
evani-net = { workspace = true, optional = true }
evani-xr = { workspace = true, optional = true }
evani-live = { workspace = true, optional = true }
evani-gltf = { workspace = true, optional = true }
evani-ui = { workspace = true, optional = true }
evani-anim = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlSelectElement",
    "HtmlInputElement",
    "HtmlOptionElement",
    "Node",
    "Event",
    "EventTarget",
] }

[lints]
workspace = true
