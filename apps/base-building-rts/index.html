<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cinder Ridge (Evani.Dev base-building-rts)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0d0f14; overflow: hidden; }
    #evani-canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  </style>
  <!-- Trunk builds the evani-base-building-rts binary; wasm-opt -Oz runs in release.
       The --enable flags match the wasm features rustc turns on by default
       for wasm32-unknown-unknown (bulk memory, sign-ext, multivalue...);
       without them Trunk's wasm-opt rejects the module. -->
  <link data-trunk rel="rust" data-bin="evani-base-building-rts" data-wasm-opt="z"
        data-wasm-opt-params="--enable-bulk-memory --enable-bulk-memory-opt --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue"
        data-type="main">
</head>
<body>
  <!-- Right click is the smart command, so the browser menu stays shut. The
       HUD is drawn inside the canvas by the kit. -->
  <canvas id="evani-canvas" oncontextmenu="return false"></canvas>
</body>
</html>
