[package]
name = "evani-match-3"
description = "Evani.Dev match-3 demo (Puff's Sweet Grid): the match-3 kit in the cartoon2d look, title to win or lose, mouse and touch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish.workspace = true

# Module switches. `cargo xtask build match-3` reads evani.toml and turns it
# into exactly these features (with --no-default-features), so a module the
# game doesn't list is an absent optional dependency: zero bytes. `default`
# mirrors evani.toml so a plain `trunk serve` matches it. No physics: the
# catalog says `none` for match-3, so evani-physics is not even a dependency.
[features]
default = ["juice", "particles", "shake", "bloom", "live"]
fx = ["dep:evani-fx"]
juice = ["fx", "evani-fx/juice"]
particles = ["fx", "evani-fx/particles"]
shake = ["fx", "evani-fx/shake"]
bloom = ["fx", "evani-fx/bloom"]
vignette = ["fx", "evani-fx/vignette"]
net = ["dep:evani-net"]
xr = ["dep:evani-xr"]
# Stage 3 modules (evani.toml `models`, `anim`, `ui`). `models` pulls in the
# model reader (evani-gltf) and the model pipeline (evani-render/models); `anim` adds
# the animation runtime (evani-anim), `ui` the box layout (evani-ui).
models = ["dep:evani-gltf", "evani-core/texture-budget", "evani-render/models", "evani-live?/models"]
anim = ["models", "dep:evani-anim", "evani-render/skinning"]
# `ui` turns on sharp MSDF text in the canvas (`[ui] fonts` in evani.toml);
# the box layout crate (evani-ui, S3-13b) comes with it.
ui = ["evani-render/msdf", "dep:evani-ui"]
live = ["dep:evani-live", "evani-render/hooks", "evani-render/capture", "evani-kit-match-3/showcase"]

[dependencies]
evani-core.workspace = true
evani-render.workspace = true
evani-kit-match-3.workspace = true
evani-look-cartoon2d.workspace = true
evani-fx = { workspace = true, optional = true }
evani-net = { workspace = true, optional = true }
evani-xr = { workspace = true, optional = true }
evani-live = { workspace = true, optional = true }
evani-gltf = { workspace = true, optional = true }
evani-ui = { workspace = true, optional = true }
evani-anim = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlSelectElement",
    "HtmlInputElement",
    "Node",
    "Event",
    "EventTarget",
    "KeyboardEvent",
    "CssStyleDeclaration",
    "DomTokenList",
] }

[lints]
workspace = true
