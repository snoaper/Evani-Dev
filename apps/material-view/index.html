<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Evani.Dev material-view</title>
  <style>
    :root { --bg: rgba(14, 16, 22, 0.82); --line: rgba(255, 255, 255, 0.12); --ink: #f2efe9; --dim: #9aa3b2;
      --accent: #e0b25a; --bottom: calc(150px + var(--dev-bar, 0px)); --top-clear: calc(3vmin + 76px); }
    html, body { margin: 0; height: 100%; background: #0d0f14; overflow: hidden; color: var(--ink);
      font: 14px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
    #evani-canvas { display: block; width: calc(100vw - var(--refs-w, 0px)); height: 100vh; touch-action: none; }
    button { font: inherit; color: var(--ink); background: rgba(255, 255, 255, 0.07); border: 1px solid var(--line);
      border-radius: 10px; min-height: 44px; padding: 0 12px; cursor: pointer; touch-action: manipulation; }
    button:hover { background: rgba(255, 255, 255, 0.14); }
    button.on { border-color: var(--accent); background: rgba(224, 178, 90, 0.22); }
    button:disabled, button.off { opacity: 0.45; cursor: default; }
    h3 { margin: 0 0 6px; font-size: 13px; font-weight: 650; letter-spacing: 0.04em; text-transform: uppercase; color: var(--dim);
      display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }

    /* --refs-w: the width of a panel docked on the right (the art styles'
       reference pictures; unset, and so 0, in builds without them). The
       view and everything centred on it stay left of it. */
    /* The HUD: what is open, top left (the touch buttons use the top right). */
    #mv-hud { position: fixed; left: 12px; top: 12px; z-index: 900; padding: 8px 12px; max-width: min(360px, calc(100vw - 50vmin)); box-sizing: border-box;
      background: var(--bg); border: 1px solid var(--line); border-radius: 10px; pointer-events: none; font-size: 13px; color: var(--dim); }
    /* Long names end in "..." and keep the whole text as a tooltip. */
    #mv-hud b, #mv-hud small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: auto; }
    #mv-hud b { font-size: 16px; color: var(--ink); }
    #mv-hud small { font-size: 12px; }

    /* Compare: the saved values (A) copied into this canvas, clipped at the
       split line; B is the live view under it. */
    #mv-a { position: fixed; inset: 0; width: calc(100vw - var(--refs-w, 0px)); height: 100vh; pointer-events: none; z-index: 10; display: none; }
    body.compare.cap-ready #mv-a { display: block; }
    #mv-split { position: fixed; z-index: 20; display: none; width: 44px; height: 100vh; transform: translateX(-50%);
      cursor: ew-resize; touch-action: none; }
    #mv-split::before { content: ""; position: absolute; left: 21px; top: 0; bottom: 0; width: 2px; background: var(--accent);
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.6); }
    #mv-split span { position: absolute; top: 45%; padding: 3px 7px; border-radius: 6px; background: var(--bg);
      font-size: 12px; font-weight: 650; white-space: nowrap; }
    #mv-split .a { right: 30px; } #mv-split .b { left: 30px; }
    body.portrait #mv-split { width: 100vw; height: 44px; transform: translateY(-50%); cursor: ns-resize; }
    body.portrait #mv-split::before { left: 0; right: 0; top: 21px; bottom: auto; width: auto; height: 2px; }
    body.portrait #mv-split span { top: auto; left: 45%; }
    body.portrait #mv-split .a { bottom: 30px; right: auto; } body.portrait #mv-split .b { top: 30px; }
    body.compare.cap-ready #mv-split { display: block; }
    #mv-cap { display: none; }
    body.compare:not(.cap-ready):not(.cap-hold) #mv-cap { display: block; }
    #mv-cap, #mv-holdbox { position: fixed; left: calc((100vw - var(--refs-w, 0px)) / 2); top: 14px; transform: translateX(-50%); z-index: 30; padding: 6px 10px;
      background: var(--bg); border: 1px solid var(--line); border-radius: 10px; font-size: 13px; max-width: 46vw; text-align: center; }
    #mv-holdbox { display: none; }
    body.compare.cap-hold #mv-holdbox { display: block; }
    #mv-holdbox button { margin-top: 6px; width: 100%; touch-action: none; }

    /* "Preparing materials": the engine writes <html data-evani-preparing="n"
       data-evani-stand-in> while shaders compile in the background (and
       data-evani-gpu-lost="n" if the graphics device was ever lost). Shown
       from page load until nothing is left to build, just above the bar. */
    #mv-prep { position: fixed; left: calc((100vw - var(--refs-w, 0px)) / 2); bottom: calc(var(--bottom) + 8px); transform: translateX(-50%); z-index: 35;
      display: none; align-items: center; gap: 8px; padding: 6px 12px; max-width: min(440px, calc(100vw - var(--refs-w, 0px) - 24px)); box-sizing: border-box;
      background: var(--bg); border: 1px solid var(--line); border-radius: 10px; font-size: 13px; pointer-events: none; }
    #mv-prep span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #mv-prep::before { content: ""; flex: none; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--accent);
      border-right-color: transparent; animation: mv-spin 0.9s linear infinite; }
    @keyframes mv-spin { to { transform: rotate(360deg); } }
    :root:not([data-evani-preparing="0"]) #mv-prep, :root[data-evani-stand-in] #mv-prep, :root[data-evani-gpu-lost] #mv-prep { display: flex; }
    #mv-prep .si, #mv-prep .lost, :root[data-evani-stand-in] #mv-prep .pl, :root[data-evani-gpu-lost] #mv-prep .pl { display: none; }
    :root[data-evani-stand-in]:not([data-evani-gpu-lost]) #mv-prep .si { display: inline; }
    :root[data-evani-gpu-lost] #mv-prep .lost { display: inline; }
    :root[data-evani-gpu-lost] #mv-prep::before { border-color: #e07a5a; border-right-color: transparent; }

    /* The browser drawer (left) and the tuning panel (right) on wide screens. */
    #mv-drawer, #mv-panel { position: fixed; z-index: 40; display: none; flex-direction: column; overflow: hidden;
      background: var(--bg); border: 1px solid var(--line); border-radius: 12px; backdrop-filter: blur(6px); }
    body.drawer-open #mv-drawer, body.panel-open #mv-panel { display: flex; }
    #mv-drawer { left: 12px; top: 92px; bottom: var(--bottom); width: 300px; }
    #mv-panel { right: calc(12px + var(--refs-w, 0px)); top: var(--top-clear); bottom: var(--bottom); width: 330px; }
    .scroll { overflow-y: auto; padding: 10px 12px 14px; flex: 1; overscroll-behavior: contain; }
    .tabs { display: flex; gap: 6px; padding: 10px 12px 0; }
    .tabs button { flex: 1; }
    body:not(.tab-rooms) .tabs [data-tab="fams"], body.tab-rooms .tabs [data-tab="rooms"] { border-color: var(--accent); }
    #mv-rooms { display: none; } body.tab-rooms #mv-rooms { display: block; } body.tab-rooms #mv-fams { display: none; }
    .fam, .room { margin-bottom: 16px; }
    .fam p, .room p { margin: 0 0 8px; color: var(--dim); font-size: 12px; }
    .fam.off h3 { opacity: 0.6; } .fam .why { color: var(--accent); }
    .mats { display: flex; flex-wrap: wrap; gap: 6px; }
    .room h3 i { font-style: normal; color: var(--accent); margin-right: 4px; }
    .slot { display: block; width: 100%; text-align: left; padding: 8px 10px; margin-bottom: 6px; }
    .slot b { display: block; font-weight: 500; }
    .slot .tag { font-size: 11px; color: var(--dim); margin-right: 6px; }
    .slot em { font-size: 12px; color: var(--accent); font-style: normal; }
    .slot .gap { display: block; font-size: 11px; color: var(--dim); }
    .slot.empty { opacity: 0.55; border-style: dashed; }
    .slot.empty:disabled { opacity: 0.4; }

    /* The generated tuning panel. */
    #mv-panel section { margin-bottom: 14px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
    .rst { min-height: 32px; font-size: 12px; text-transform: none; letter-spacing: 0; }
    .row { margin: 8px 0 10px; }
    .lab { display: flex; justify-content: space-between; gap: 8px; }
    .lab b { font-weight: 500; color: var(--accent); font-variant-numeric: tabular-nums; }
    .row small { display: block; color: var(--dim); font-size: 11px; font-family: ui-monospace, Consolas, monospace; overflow-wrap: anywhere; }
    .row input[type=range] { width: 100%; height: 44px; margin: 0; accent-color: var(--accent); touch-action: none; }
    .row input[type=color] { width: 100%; height: 44px; border: 1px solid var(--line); border-radius: 10px; background: none; padding: 2px; }
    .row .axis { display: flex; align-items: center; gap: 8px; } .row .axis i { width: 12px; color: var(--dim); }
    .tog { min-width: 72px; }
    .ft { margin: 8px 0; color: var(--dim); } .ft b { color: var(--ink); font-variant-numeric: tabular-nums; }
    .none { color: var(--dim); }

    /* The bar (lights, sun, turntable, compare) and the scene row. */
    /* The bar wraps onto a second row rather than scrolling a button out of
       sight; the page measures its top (--bottom) for the side panels. */
    #mv-bar { position: fixed; left: calc((100vw - var(--refs-w, 0px)) / 2); bottom: calc(88px + var(--dev-bar, 0px)); transform: translateX(-50%); z-index: 50; display: flex; gap: 6px;
      align-items: center; flex-wrap: wrap; justify-content: center; width: max-content; max-width: calc(100vw - var(--refs-w, 0px) - 16px); padding: 4px;
      background: var(--bg); border: 1px solid var(--line); border-radius: 14px; box-sizing: border-box; }
    #mv-lights { flex-wrap: wrap; justify-content: center; }
    #mv-bar > *, #mv-lights > * { flex: none; }
    /* The light presets may shrink to the bar's width and wrap: as a flex: none
       child the row kept its whole width and ran off both edges of a phone
       held upright once Daylight joined it (critic round 7). */
    #mv-bar > #mv-lights { flex: 0 1 auto; min-width: 0; max-width: 100%; }
    #mv-bar .sep { width: 1px; height: 30px; background: var(--line); margin: 0 2px; }
    #mv-lights { display: flex; gap: 6px; }
    #mv-sun { width: 44px; height: 44px; border-radius: 50%; padding: 0; position: relative; touch-action: none; cursor: grab;
      background: radial-gradient(circle at 50% 50%, #ffd27a 0 7px, rgba(255, 210, 122, 0.15) 8px 100%); }
    #mv-sun::after { content: "Sun"; position: absolute; left: 0; right: 0; bottom: -2px; font-size: 9px; color: var(--dim); }
    body.spin-on [data-cmd="spin"], body.compare [data-cmd="compare"],
    body.drawer-open [data-cmd="browse"], body.panel-open [data-cmd="tune"] { border-color: var(--accent); background: rgba(224, 178, 90, 0.22); }
    [data-cmd="save-a"] { display: none; } body.compare [data-cmd="save-a"] { display: inline-block; }
    #mv-scenes { position: fixed; left: calc((100vw - var(--refs-w, 0px)) / 2); bottom: calc(10px + var(--dev-bar, 0px)); transform: translateX(-50%); z-index: 50; display: flex; gap: 8px;
      max-width: calc(100vw - var(--refs-w, 0px) - 16px); overflow-x: auto; padding: 2px; scrollbar-width: none; }
    #mv-scenes button { flex: none; width: 72px; height: 70px; padding: 4px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 2px; font-size: 11px; background: var(--bg); }
    #mv-scenes .i { font-size: 26px; line-height: 1; }

    /* The dev server's "Drop a model here" bar (evani-live, dev builds only;
       a ship build never has it): one short line along the bottom. While it
       is on the page the bar, the scene row and the sheets move up by
       --dev-bar, and the reference panel and the phone sheet cover it. */
    :root:has(#evani-convert-zone) { --dev-bar: 52px; }
    #evani-convert-zone { z-index: 45 !important; right: calc(12px + var(--refs-w, 0px)) !important;
      padding: 4px 6px 4px 12px !important; }
    #evani-convert-zone-hint { white-space: nowrap; }
    #evani-convert-zone button { min-height: 32px; white-space: nowrap; }

    /* The round touch buttons, top right (pause, Reset, Spin from the edge):
       one button width plus a 10px gap apart, so they never overlap where
       the layout's 11vmin steps are under the buttons' 48px floor (phones),
       and left of a docked reference panel. */
    :root { --tb: clamp(48px, 9vmin, 56px); --tb-r: calc(var(--refs-w, 0px) + max(8px, env(safe-area-inset-right)) + 3vmin); }
    #evani-touch [data-id="pause"] { right: var(--tb-r) !important; }
    #evani-touch [data-id="reset"] { right: calc(var(--tb-r) + var(--tb) + 10px) !important; }
    #evani-touch [data-id="spin"] { right: calc(var(--tb-r) + 2 * (var(--tb) + 10px)) !important; }

    /* Phones and narrow windows: the drawer and the panel are bottom sheets. */
    @media (max-width: 759px) {
      /* The bar wraps to two rows so Compare and Spin stay on screen. */
      :root { --bottom: calc(235px + var(--dev-bar, 0px)); }
      /* Phones can't drop files: the dev bar keeps only its button. */
      #evani-convert-zone-hint { display: none; }
      #mv-drawer, #mv-panel { left: 6px; right: 6px; width: auto; top: auto; bottom: var(--bottom); max-height: 48vh; }
      #mv-scenes { max-width: calc(100vw - 12px); flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; overscroll-behavior-x: contain; }
      #mv-scenes button { width: 58px; height: 60px; }
      #mv-scenes .i { font-size: 22px; }
      #mv-bar { bottom: calc(76px + var(--dev-bar, 0px)); width: calc(100vw - 16px); }
      #mv-bar .sep { display: none; }
      #mv-bar button { padding: 0 10px; }
      #mv-hud { max-width: calc(100vw - 60vmin); }
      #mv-hud b { font-size: 14px; }
    }
    /* The narrowest phones: the scene tiles wrap onto two centred rows
       (nine tiles since the studio joined; one sideways-scrolling row cut
       the last one, critic round 7), and the bar sits above both. */
    @media (max-width: 440px) {
      #mv-scenes { gap: 4px; flex-wrap: wrap; justify-content: center; overflow-x: visible; width: calc(100vw - 12px); }
      #mv-scenes button { width: 64px; height: 52px; font-size: 10px; line-height: 1.05; }
      #mv-scenes .i { font-size: 18px; }
      #mv-bar { bottom: calc(126px + var(--dev-bar, 0px)); }
      /* The light presets flow with the other buttons: three rows, not four,
         so the bar covers less of the subject (critic round 7: the bust). */
      #mv-bar > #mv-lights { display: contents; }
    }
    /* Short screens (a phone held sideways, a small half window): smaller
       buttons and scene tiles, and no dev drop strip, so the view keeps
       most of the height. */
    @media (max-height: 520px) {
      :root:has(#evani-convert-zone) { --dev-bar: 0px; }
      #evani-convert-zone { display: none !important; }
      button { min-height: 36px; }
      #mv-scenes { bottom: 6px; }
      #mv-scenes button { width: 56px; height: 46px; font-size: 10px; gap: 0; }
      #mv-scenes .i { font-size: 18px; }
      #mv-bar { bottom: 56px; padding: 3px; gap: 4px; }
      #mv-bar button { padding: 0 8px; }
      #mv-sun { width: 36px; height: 36px; }
      #mv-hud { padding: 5px 9px; }
      #mv-hud b { font-size: 13px; }
      #mv-hud small { font-size: 11px; }
    }
  </style>
  <!-- Trunk builds the evani-material-view binary; wasm-opt -Oz runs in release.
       The --enable flags match the wasm features rustc turns on by default
       for wasm32-unknown-unknown (bulk memory, sign-ext, multivalue...);
       without them Trunk's wasm-opt rejects the module. --low-memory-unused:
       Rust puts its 1 MB stack first in memory, so the first 1 KB is never
       read or written; wasm-opt folds address offsets (DECISIONS, size trims). -->
  <link data-trunk rel="rust" data-bin="evani-material-view" data-wasm-opt="z"
        data-wasm-opt-params="--enable-bulk-memory --enable-bulk-memory-opt --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue --low-memory-unused"
        data-type="main">
  <!-- The layered finishes' models and their stream manifest, fetched from
       models/ next to the page. -->
  <link data-trunk rel="copy-dir" href="assets/models">
  <link data-trunk rel="copy-dir" href="assets/proc-refs">
</head>
<body>
  <canvas id="evani-canvas"></canvas>
  <canvas id="mv-a" aria-hidden="true"></canvas>
  <div id="mv-split"><span class="a">A saved</span><span class="b">B now</span></div>
  <div id="mv-cap">Hold still: copying the saved look (A)&hellip;</div>
  <div id="mv-holdbox">This browser can't copy the view for a split, so compare is a flip: hold the button to see the saved look (A).
    <button id="mv-hold">Hold to see A</button></div>
  <div id="mv-prep" role="status" aria-live="polite"><span class="pl" title="Preparing materials">Preparing materials&hellip;</span><span class="si" title="Preparing materials: a simple preview shows until the full finish is ready">Preparing materials&hellip; simple preview for now</span><span class="lost" title="The graphics card restarted; the view is coming back">Graphics restarted; the view is coming back&hellip;</span></div>
  <div id="mv-hud">Evani.Materials</div>
  <aside id="mv-drawer" aria-label="Material browser">
    <div class="tabs"><button data-tab="fams">Families</button><button data-tab="rooms">World rooms</button></div>
    <div class="scroll"><div id="mv-fams"></div><div id="mv-rooms"></div></div>
  </aside>
  <aside id="mv-panel" aria-label="Tuning panel">
    <div class="scroll" id="mv-rows"></div>
  </aside>
  <div id="mv-bar">
    <button data-cmd="browse">Browse</button>
    <button data-cmd="tune">Tune</button>
    <span class="sep"></span>
    <div id="mv-lights"></div>
    <button id="mv-sun" title="Drag to move the sun"></button>
    <button data-cmd="spin" title="Turntable (T)">Spin</button>
    <span class="sep"></span>
    <button data-cmd="compare" title="Compare saved (A) and current (B) (C)">Compare</button>
    <button data-cmd="save-a" title="Make the current values the saved ones (A)">Save as A</button>
  </div>
  <nav id="mv-scenes" aria-label="Scenes"></nav>
</body>
</html>
