[package]
name = "evani-tactical-fps"
description = "Evani.Dev tactical-fps: test game with a minimal debug panel (tier switch, effect toggles, overlay)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish.workspace = true

# Module switches. `cargo xtask build tactical-fps` reads evani.toml and turns it
# into exactly these features (with --no-default-features), so a module the
# game doesn't list is an absent optional dependency: zero bytes.
# `default` mirrors evani.toml so a plain `trunk serve` matches it.
[features]
default = [
    "bloom", "shadows", "fog", "physics-simple", "net", "xr",
    "live",
]
fx = ["dep:evani-fx"]
bloom = ["fx", "evani-fx/bloom"]
vignette = ["fx", "evani-fx/vignette"]
shadows = ["fx", "evani-fx/shadows"]
fog = ["fx", "evani-fx/fog"]
decals = ["fx", "evani-fx/decals"]
grade = ["fx", "evani-fx/grade"]
physics-simple = ["dep:evani-physics", "evani-physics/simple"]
physics-rigid = ["dep:evani-physics", "evani-physics/rigid"]
# The kit runs the match through evani-net when the game lists `net`.
net = ["dep:evani-net", "evani-kit-tactical-fps/net"]
# Dev only, never in evani.toml: a second local player over the loopback.
net-dev = ["net", "evani-kit-tactical-fps/net-dev"]
xr = ["dep:evani-xr"]
# Stage 3 modules (evani.toml `models`, `anim`, `ui`). `models` pulls in the
# model reader (evani-gltf) and the model pipeline (evani-render/models); `anim` adds
# the animation runtime (evani-anim), `ui` the box layout (evani-ui).
models = ["dep:evani-gltf", "evani-core/texture-budget", "evani-render/models"]
anim = ["models", "dep:evani-anim"]
# `ui` turns on sharp MSDF text in the canvas (`[ui] fonts` in evani.toml);
# the box layout crate (evani-ui, S3-13b) comes with it.
ui = ["evani-render/msdf", "dep:evani-ui"]
# The S3-13a text proof panel instead of the S3-13b HUD panel (needs `ui`).
text-proof = ["ui"]
live = ["dep:evani-live", "evani-render/hooks", "evani-render/capture"]
# The S3-10 surface-relief proof (`trunk build --features relief`; never in
# evani.toml, so the default and ship builds are unchanged): the shared
# relief fixture drawn with the toon look's micro-detail patterns.
relief = ["models", "toon", "evani-render/relief", "evani-look-toon?/relief"]
# The game's own look is photoreal; this layers the toon look over it for the
# relief proof only (never in evani.toml, so ship builds never carry it).
toon = ["dep:evani-look-toon"]

[dependencies]
evani-core.workspace = true
evani-render.workspace = true
evani-kit-tactical-fps.workspace = true
evani-look-photoreal.workspace = true
evani-look-toon = { workspace = true, optional = true }
evani-fx = { workspace = true, optional = true }
evani-physics = { workspace = true, optional = true }
evani-net = { workspace = true, optional = true }
evani-xr = { workspace = true, optional = true }
evani-live = { workspace = true, optional = true }
evani-gltf = { workspace = true, optional = true }
evani-ui = { workspace = true, optional = true }
evani-anim = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlSelectElement",
    "HtmlInputElement",
    "HtmlOptionElement",
    "Node",
    "Event",
    "EventTarget",
] }

[lints]
workspace = true
