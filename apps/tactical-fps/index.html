<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evani.Dev tactical-fps</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0d0f14; overflow: hidden; }
    #evani-canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
    /* The tactical-fps HUD, bottom left (the debug overlay and panel use the
       top corners): the match text the kit writes (score, timer, health,
       weapon; matchhud.rs) and, on desktop, the controls. */
    #tactical-fps-hud { position: fixed; left: 12px; bottom: 12px; z-index: 900; padding: 6px 10px;
      max-width: min(46vw, 420px); font: 600 15px/1.35 system-ui, sans-serif; color: #f9f6f1;
      background: rgba(13, 15, 20, 0.6); border-radius: 6px; pointer-events: none; }
    #tf-match { white-space: pre-line; }
    #tf-match:empty { display: none; }
    #tactical-fps-hud small { display: block; margin-top: 4px; font-weight: 400; font-size: 13px; color: #a0c4ed; }
    /* The crosshair: during the warm-up and the match, alive and not paused. */
    #tf-crosshair { display: none; position: fixed; left: 50%; top: 50%; width: 22px; height: 22px;
      margin: -11px 0 0 -11px; z-index: 800; pointer-events: none; }
    #tf-crosshair::before, #tf-crosshair::after { content: ""; position: absolute; background: rgba(249, 246, 241, 0.9);
      box-shadow: 0 0 2px rgba(0, 0, 0, 0.9); }
    #tf-crosshair::before { left: 10px; top: 0; width: 2px; height: 22px; }
    #tf-crosshair::after { left: 0; top: 10px; width: 22px; height: 2px; }
    body[data-alive="1"][data-paused="0"][data-phase="pre"] #tf-crosshair,
    body[data-alive="1"][data-paused="0"][data-phase="play"] #tf-crosshair { display: block; }
    /* The pause screen. */
    #tf-pause { display: none; position: fixed; inset: 0; z-index: 850; align-items: center; justify-content: center;
      background: rgba(13, 15, 20, 0.55); pointer-events: none; }
    #tf-pause div { padding: 18px 28px; text-align: center; color: #f9f6f1; background: rgba(13, 15, 20, 0.85);
      border-radius: 10px; font: 700 28px/1.3 system-ui, sans-serif; }
    #tf-pause small { display: block; margin-top: 6px; font: 400 15px/1.35 system-ui, sans-serif; color: #a0c4ed; }
    body[data-paused="1"] #tf-pause { display: flex; }
    #tf-pause .touch { display: none; }
    /* Phones and tablets: the move stick is bottom left and the buttons bottom
       right, so the match text goes top centre (over the debug overlay, which
       fills the top of a phone) and the key hint goes. */
    @media (pointer: coarse) {
      #tactical-fps-hud { left: 50%; right: auto; top: 8px; bottom: auto; transform: translateX(-50%);
        max-width: 52vw; font-size: 13px; text-align: center; z-index: 1001; }
      #tactical-fps-hud small, #tf-pause .keys { display: none; }
      #tf-pause .touch { display: block; }
    }
  </style>
  <!-- Trunk builds the evani-tactical-fps binary; wasm-opt -Oz runs in release.
       The --enable flags match the wasm features rustc turns on by default
       for wasm32-unknown-unknown (bulk memory, sign-ext, multivalue...);
       without them Trunk's wasm-opt rejects the module. -->
  <link data-trunk rel="rust" data-bin="evani-tactical-fps" data-wasm-opt="z"
        data-wasm-opt-params="--enable-bulk-memory --enable-bulk-memory-opt --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue"
        data-type="main">
</head>
<body>
  <canvas id="evani-canvas"></canvas>
  <div id="tactical-fps-hud"><div id="tf-match">Evani.Dev tactical-fps</div><small>WASD move, mouse look, click fire, Space jump, Q gun, Esc pause</small></div>
  <div id="tf-crosshair"></div>
  <div id="tf-pause"><div>Paused<small class="keys">Click or press Esc to carry on</small><small class="touch">Tap Fire or pause to carry on</small></div></div>
</body>
</html>
