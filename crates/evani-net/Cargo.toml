[package]
name = "evani-net"
description = "Evani.Dev multiplayer module: netcode core, lockstep with a referee, host port, referee ABI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish.workspace = true

# Every part beyond the snapshot core is its own switch, so a game takes only
# what it uses and games that list none of them are byte for byte unchanged.
[features]
# Deterministic input-only netcode with a referee (src/lockstep.rs).
lockstep = []
# The neutral headless referee ABI `evani-referee/1` (src/referee.rs): a game's
# referee crate exports it with `export_referee!`; no imports, no clock.
referee = ["lockstep"]
# The page side of `evani-net/1` (src/port.rs, web/port.js): bytes over a
# MessagePort the host page (or an in-page adapter) hands over; the game
# opens no network of its own. wasm only.
port = ["dep:wasm-bindgen", "dep:js-sys"]
# The sync layer (src/sync.rs, docs/NET_SYNC.md): client prediction with
# server reconciliation and error smoothing for the local entity, snapshot
# interpolation with an adaptive delay and capped extrapolation for remote
# ones, and the `net.sync.*` parameters. A game turns it on with
# `evani-net/sync` in its `net` feature; without it nothing of it is built.
sync = []

[dependencies]
evani-core.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }

# The crate's own tests always build the sync layer (a dev-dependency on
# itself; normal builds of a game are untouched).
[dev-dependencies]
evani-net = { path = ".", features = ["sync"] }

[lints]
workspace = true
