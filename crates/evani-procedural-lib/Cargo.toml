[package]
name = "evani-procedural-lib"
description = "Evani.Dev procedural library: 24 categories and 357 assets (catalog/procedural/library.json), one Cargo feature per category and per asset so a game builds only what it lists; reference generators, the storm sea, ocean, water, glass, sky and grass wrapped as they are, and name-based placeholders for the rest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish.workspace = true

# A game lists categories or assets in evani.toml:
#   [modules] procedural = ["terrain", "geometry-cube-cuboid"]
# which turns on the app features `procedural` (this crate, optional) and
# `procedural-<part>` (each forwarding to this crate's feature `<part>`).
# Nothing unlisted is compiled: every asset's code and registration sits
# behind its own feature, and a game without `procedural` has no
# dependency on this crate at all. docs/PROCEDURAL.md.
#
# Features: `<category>` turns on all its assets; `<category>-<asset>` one
# asset; `cat-<category>` is internal (the category's entry, on with any of
# its assets); `host-*` are internal (the wrapped engine modules, on only
# with an asset that wraps them).
[features]
default = []
# Dev builds with live capture: the wrapped modules follow a capture's
# camera and jitter. Ship builds leave it off.
capture = ["evani-grass?/capture", "evani-material-nature?/capture"]
# The wrapped engine modules, as they are.
host-nature = ["dep:evani-material-nature"]
host-grass = ["dep:evani-grass"]
host-sky = ["dep:evani-material-proc", "evani-material-proc/sky"]
# Realism: the assets drawn in catalogue materials (evani-procedural's
# surface feature, the textured-model path). On only with such an asset.
realism = ["evani-procedural/surface"]
# Behaviour fields: the wind gusts' wind and the water currents' flow, for
# Evani.commons' test scenes (evani-procedural's `behaviour`). Only the
# commons render app turns it on; no game lists it.
behaviour = ["evani-procedural/behaviour"]
# The realism preview forms (a finish on a door, a table, a fence...): the
# Material library view only, so no game downloads them.
preview = ["realism"]
# The typed building-block graph as engine data (blocks_table, written by
# tools/procedural/gen_blocks.mjs) and `composition()`: an asset assembled
# from its layer, scatter and base links (docs/PROCEDURAL.md "Composition
# from typed links"). Off unless a game asks for it.
compose = []
material-soil-dark-loam = [
    "realism",
]
material-snow-fresh-powder = [
    "realism",
]

# BEGIN generated features (tools/procedural/gen_library.py)
# 1. Core geometry and primitives (15 assets)
geometry = ["geometry-cube-cuboid", "geometry-bevelled-box", "geometry-uv-sphere", "geometry-icosphere", "geometry-cylinder", "geometry-cone", "geometry-capsule", "geometry-torus", "geometry-plane-grid", "geometry-disc-ring", "geometry-pyramid", "geometry-wedge-ramp", "geometry-lathed-rotational-mesh", "geometry-extruded-polygon", "geometry-swept-spline-tube"]
cat-geometry = []
geometry-cube-cuboid = ["cat-geometry", "realism"]
geometry-bevelled-box = ["cat-geometry", "realism"]
geometry-uv-sphere = ["cat-geometry", "realism"]
geometry-icosphere = ["cat-geometry", "realism"]
geometry-cylinder = ["cat-geometry", "realism"]
geometry-cone = ["cat-geometry", "realism"]
geometry-capsule = ["cat-geometry"]
geometry-torus = ["cat-geometry"]
