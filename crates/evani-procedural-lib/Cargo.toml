# 2. Terrain and landforms (15 assets)
terrain = ["terrain-flat-terrain", "terrain-rolling-hills", "terrain-mountains", "terrain-mountain-ranges", "terrain-valleys", "terrain-canyons", "terrain-cliffs", "terrain-plateaus", "terrain-craters", "terrain-sand-dunes", "terrain-beaches", "terrain-islands", "terrain-caves", "terrain-ravines", "terrain-terraced-landscapes"]
