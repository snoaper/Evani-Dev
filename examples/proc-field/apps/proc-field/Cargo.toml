[package]
name = "evani-proc-field"
description = "Evani.Dev procedural library proof: places the procedural assets its evani.toml lists, so builds with none, one asset and one category show what each adds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# `[modules] procedural = [..]` in evani.toml turns on `procedural` (the
# library crate, optional) and `procedural-<part>` per listed category or
# asset, each forwarding to evani-procedural-lib's feature of that name.
[features]
default = ["procedural", "procedural-terrain-rolling-hills"]
procedural = ["dep:evani-procedural-lib", "evani-kit-proc-field/procedural"]
procedural-terrain-rolling-hills = ["procedural", "evani-procedural-lib/terrain-rolling-hills"]
procedural-geometry-cube-cuboid = ["procedural", "evani-procedural-lib/geometry-cube-cuboid"]
procedural-geometry-icosphere = ["procedural", "evani-procedural-lib/geometry-icosphere"]
procedural-geometry-uv-sphere = ["procedural", "evani-procedural-lib/geometry-uv-sphere"]
procedural-geometry-bevelled-box = ["procedural", "evani-procedural-lib/geometry-bevelled-box"]
procedural-geometry = ["procedural", "evani-procedural-lib/geometry"]
procedural-terrain = ["procedural", "evani-procedural-lib/terrain"]
procedural-rocks-medium-rocks = ["procedural", "evani-procedural-lib/rocks-medium-rocks"]
procedural-trees = ["procedural", "evani-procedural-lib/trees"]
procedural-trees-oak-trees = ["procedural", "evani-procedural-lib/trees-oak-trees"]
procedural-buildings-castles = ["procedural", "evani-procedural-lib/buildings-castles"]
procedural-city = ["procedural", "evani-procedural-lib/city"]
procedural-vehicles-sedans = ["procedural", "evani-procedural-lib/vehicles-sedans"]
procedural-animals = ["procedural", "evani-procedural-lib/animals"]
# The realism parity scene (procedural realism round 8; docs/PROCEDURAL.md
# "Applying a realism material in a game"): the cast-concrete cube in the
# engine's realism studio, with the look, recipes, light and shadow
# features the Material library builds, so a game's picture can be held
# against the library's (tools/procedural/parity.mjs). Dev only: the gating
# proof's builds never list it, so they are unchanged.
wall = [
    "procedural", "procedural-geometry-cube-cuboid", "evani-kit-proc-field/wall",
    "dep:evani-look-stylizedpbr", "evani-look-stylizedpbr/film", "evani-look-stylizedpbr/pcss", "evani-look-stylizedpbr/gtao",
    "dep:evani-fx", "evani-fx/shadows",
    "evani-render/models", "evani-render/look-surface", "evani-render/material-recipes", "evani-render/ibl", "evani-render/gtao",
    "evani-render/pcss-stable", "evani-render/shadow-cascades", "evani-render/studio-sky", "evani-render/contact-shadows", "evani-render/hooks",
    "dep:evani-material-recipes", "evani-material-recipes/recipe-plaster", "evani-material-recipes/cond-dust",
]
