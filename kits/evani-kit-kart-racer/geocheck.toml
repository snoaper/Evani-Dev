# Geocheck tags for Sugarpeak Rally (docs/GEOCHECK.md, "Intentional cases").
# Each entry is a case that is meant to look the way it does; the report
# still lists it, as tagged.
#
# The road, the grass shoulder and bank, the kerbs and the rails are
# continuous swept meshes (src/trackmesh.rs, drawn through MeshLibrary), so
# the seam overlaps of the old straight 4 m boxes are gone. The painted
# lines are one decal mesh (draw_decal), as are the start strip and the
# grid brackets.

[[tag]]
check = "moving"
object = "goo*"
reason = "the goo puddle is a hazard lying flat in the road; its blob sinks into the asphalt on purpose"

[[tag]]
check = "moving"
object = "boost_flame*"
reason = "the boost flame is a glowing effect behind the kart; it passes through kerbs and grass for a frame or two on bumps and slopes"

# The mountain domes (the backdrop mountains and the hill ring) are pushed
# into each other on purpose, so they read as one rolling range with no gaps.
# The tag is pinned by place as well as by label: twelve spheres of radius
# 4.76 km, centred 5 km out from the meadow centre (5, 17.5) every 30
# degrees, together hold everything from about 250 m out (240 m in line with
# a centre) and nothing nearer. The closest dome crossing is 267 m out; the
# track lies within 135 m of the centre and its trees within 220 m, so an
# overlap of anything by the track still shows.
[[tag]]
check = "overlap"
object = "mountain_* (mesh 7)"
at = [5005.0, 0.0, 17.5]
radius = 4760.0
reason = "mountain domes of the backdrop and the hill ring pushed into each other on purpose, one rolling range (more than 240 m out from the meadow centre)"

