# The clouds fly 105 to 160 m up, 400 to 570 m out (scenery.rs). Pinned by
# height: a sphere of radius 19.906 km centred 20 km over the meadow centre
# holds what is higher than 94 m over the centre, rising to 102 m at 570 m
# out, and nothing lower (no other part of the world flies that high).
[[tag]]
check = "floating"
object = "kerb_white*"
at = [5.0, 20000.0, 17.5]
radius = 19906.0
reason = "the clouds fly high over the meadow"

[[tag]]
check = "floating"
at = [-80.6, 5.1, -59.8]
radius = 3.0
reason = "the start lights' housing hangs from the start banner (it is drawn with the race, so geocheck judges it apart from the banner)"

# Tooling gap: geocheck's kart adapter (tools/evani-geocheck/src/cli/kart.rs,
# limit) assumes one wall distance all round, half_width + verge -
# kart_radius. On the inside of the two hairpins the rail comes in
# (trackmesh::rail_lat) and so does the kit's wall (kart.rs, walls,
# Track::side_cap): the karts stop at the drawn rail there.
[[tag]]
check = "collision"
at = [71.5, 3.6, 47.9]
radius = 3.0
reason = "inside of a hairpin: the kit's wall follows the drawn rail in (Track::side_cap); geocheck's adapter assumes the constant wall distance"

[[tag]]
check = "collision"
at = [106.0, 3.2, 27.6]
radius = 3.0
reason = "inside of a hairpin: the kit's wall follows the drawn rail in (Track::side_cap); geocheck's adapter assumes the constant wall distance"
