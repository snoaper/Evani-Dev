[package]
name = "evani-geocheck"
description = "Evani.Dev geometry integrity checks (dev tool, never in a game download): overlaps, floating objects, gaps, z-fighting, mesh validation, moving clipping, collision mismatch and camera clipping"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish.workspace = true

[features]
# The command-line tool (`cargo run -p evani-geocheck -- <app>`): runs a kit
# natively, drives the live capture tool, writes the report. evani-live uses
# the library with `default-features = false` (pure geometry, wasm-safe).
default = ["cli"]
cli = [
    "dep:toml",
    "dep:flate2",
    "dep:sha2",
    "dep:evani-kit-kart-racer",
    "dep:evani-look-toon",
    "dep:evani-kit-example",
    "dep:evani-look-basic",
]

[dependencies]
evani-core.workspace = true
evani-render.workspace = true
serde_json.workspace = true
toml = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
# The z-fight capture cache's key (already in the tree for evani-lookguard; DECISIONS.md).
sha2 = { version = "=0.10.9", default-features = false, optional = true }
# Kit adapters (native only): collision data and a wall-hugging bot.
evani-kit-kart-racer = { workspace = true, optional = true }
evani-look-toon = { workspace = true, optional = true }
# The sandbox adapter: the example kit draws the sandbox scene, with the basic look.
evani-kit-example = { workspace = true, optional = true }
evani-look-basic = { workspace = true, optional = true }

[[bin]]
name = "evani-geocheck"
path = "src/main.rs"
required-features = ["cli"]

[lints]
workspace = true
